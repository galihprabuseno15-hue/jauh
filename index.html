<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Stadion ESP32 - Kontrol Lampu</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      background: linear-gradient(180deg, #1b5e20 0%, #388e3c 100%);
      color: white;
      min-height: 100vh;
    }

    .kartu-utama {
      background-color: rgba(255, 255, 255, 0.95);
      color: #1b5e20;
      max-width: 350px;
      margin: 30px auto;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
      border: 4px solid #ffffff;
    }

    .gambar-lampu {
      font-size: 90px;
      margin: 15px 0;
      transition: all 0.3s ease;
      filter: grayscale(100%) opacity(0.3);
    }

    .lampu-nyala {
      filter: grayscale(0%) drop-shadow(0 0 25px #facc15);
      transform: scale(1.1);
    }

    .tombol {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 5px;
      color: white;
    }

    .tombol-on { background-color: #2e7d32; }
    .tombol-off { background-color: #c62828; }

    .status-koneksi {
      font-size: 12px;
      margin-top: 15px;
      color: #666;
    }
  </style>
</head>
<body>

  <div class="kartu-utama">
    <h2>⚽ Stadion ESP32 ⚽</h2>
    <p>Kontrol Lampu Lapangan</p>

    <div id="lampu" class="gambar-lampu">💡</div>

    <button class="tombol tombol-on" onclick="kirim('ON')">NYALAKAN</button>
    <button class="tombol tombol-off" onclick="kirim('OFF')">MATIKAN</button>

    <div id="status" class="status-koneksi">Menghubungkan ke Broker...</div>
  </div>

  <script>
    const topic = 'rumah/lampu_unik_123';
    const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');

    const lampuElem = document.getElementById('lampu');
    const statusElem = document.getElementById('status');

    client.on('connect', () => {
      statusElem.innerText = 'Terhubung ke Broker MQTT';
      statusElem.style.color = '#2e7d32';
      client.subscribe(topic);
    });

    client.on('message', (topikDiterima, pesan) => {
      const perintah = pesan.toString();
      if (perintah === 'ON') {
        lampuElem.classList.add('lampu-nyala');
      } else if (perintah === 'OFF') {
        lampuElem.classList.remove('lampu-nyala');
      }
    });

    client.on('error', (err) => {
      statusElem.innerText = 'Koneksi Gagal';
      statusElem.style.color = '#c62828';
    });

    function kirim(perintah) {
      client.publish(topic, perintah);
    }
  </script>

</body>
</html>
